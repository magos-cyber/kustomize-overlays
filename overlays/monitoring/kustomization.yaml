apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../bases/deployment
  - ../../bases/service

namespace: monitoring
namePrefix: mon-

commonLabels:
  app.kubernetes.io/component: monitoring

patches:
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
